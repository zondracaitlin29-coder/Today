<style>
:root{--bg:#FFF8F2;--card:#FFFFFF;--tx:#2A2A3B;--mu:#5E5F72;--ln:#EADBCF;--soft:#FFE2D0;--terra:#B84A24;--navy:#3B4A7A;--olive:#6B6A2E;--plum:#7A3E65;--teal:#2F6F73;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1E26;--card:#2A2A35;--tx:#F3EDE6;--mu:#B9B5C4;--ln:#3C3C4A;--soft:#4A3329;--terra:#E8906C;--navy:#9FB0EA;--olive:#C9C77A;--plum:#E0A3CB;--teal:#86CBCF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1E26;--card:#2A2A35;--tx:#F3EDE6;--mu:#B9B5C4;--ln:#3C3C4A;--soft:#4A3329;--terra:#E8906C;--navy:#9FB0EA;--olive:#C9C77A;--plum:#E0A3CB;--teal:#86CBCF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 'Figtree',system-ui,sans-serif}
#app{max-width:520px;margin:auto;padding:16px 16px 48px}
h1{margin:0;font:700 30px/1.1 'Bricolage Grotesque',Georgia,sans-serif}
h2{margin:0;font:700 26px/1.1 'Bricolage Grotesque',Georgia,sans-serif}
h3{margin:24px 0 8px;font-size:18px}
p{margin:6px 0}
.mu{color:var(--mu)}
button{font:inherit;cursor:pointer;color:var(--tx)}
.tabs{display:flex;gap:6px;margin:14px 0 6px}
.tabs button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--ln);background:var(--card);font-weight:600}
.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.gl{display:block;width:100%;text-align:left;margin:12px 0;padding:18px;border-radius:16px;border:1px solid var(--ln);border-left:10px solid var(--c);background:var(--card)}
.gl b{display:block;font-size:21px;color:var(--c)}
.gl span{color:var(--mu)}
.hero{border-radius:16px;padding:18px;background:var(--card);border:1px solid var(--ln);border-left:10px solid var(--c);margin-top:12px}
.hero h2{color:var(--c)}
.hero .k{font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.lk{background:none;border:0;padding:0;color:var(--terra);font-weight:600;text-decoration:underline;margin-top:8px}
.task{display:flex;gap:14px;align-items:flex-start;padding:16px;margin:10px 0;border-radius:14px;background:var(--card);border:1px solid var(--ln)}
.task b{font-size:18px}
.task.d b{text-decoration:line-through;color:var(--mu)}
.tk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:var(--card);color:var(--card);font-size:22px;font-weight:700;line-height:1}
.task.d .tk{background:var(--c);color:var(--card)}
.ok{padding:14px;border-radius:12px;background:var(--soft);font-weight:600;margin:10px 0}
.tips{margin:0;padding-left:20px}
.tips li{margin:6px 0}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px 16px 14px;margin:12px 0}
.sn{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0}
.sn b{display:block;color:var(--terra);margin-bottom:3px;font-size:15px}
.sn span{white-space:pre-wrap;color:var(--tx)}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 16px;margin:12px 0}
summary{font-weight:700;font-size:18px;padding:12px 0;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--ln);margin-bottom:6px}
details>ul{padding-left:20px;margin:8px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.s{opacity:1}
</style>
</head>

const save=()=>sv(key,S);
const SUG=["c","m","r","m","m","c","c"];
const COPY={};let ci=0;
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.className="s";setTimeout(()=>e.className="",1400)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch{}a.remove()}toast("Copied")}
const sn=(t,x)=>{COPY[ci]=x;return `<button class="sn" data-a="cp" data-i="${ci++}"><b>${t}</b><span>${x}</span></button>`};
function draw(){
 ci=0;
 let h=`<h1>${DN[T]}</h1><div class="mu">${now.getDate()} ${now.toLocaleString("en-ZA",{month:"long"})}</div><div class="tabs"><button data-a="tab" data-v="day" class="${tab==="day"?"on":""}">Today</button><button data-a="tab" data-v="sc" class="${tab==="sc"?"on":""}">Scripts</button></div>`;
 if(tab==="sc"){
  h+=`<p class="mu">Tap any message to copy it. Replace [name] before you send.</p>`+SCR.map((c,i)=>`<details ${i===1?"open":""}><summary>${c.n}</summary>${c.rules?`<ul>${c.rules.map(r=>`<li>${r}</li>`).join("")}</ul>`:c.s.map(x=>sn(x[0],x[1])).join("")}</details>`).join("");
  app.innerHTML=h;return;
 }
 if(!S.goal){
  h+=`<h2 style="margin-top:20px">What’s today’s goal?</h2><p class="mu">Pick one. It decides what you see.</p>`+Object.keys(GL).map(k=>`<button class="gl" style="--c:var(--${GL[k].c})" data-a="goal" data-v="${k}"><b>${GL[k].n}${SUG[T]===k?" (suggested today)":""}</b><span>${GL[k].d}</span></button>`).join("")+`<p class="mu">Not sure? Choose Make money while you’re still landing your first orders.</p>`;
  app.innerHTML=h;return;
 }
 const g=GL[S.goal],n=g.tasks.filter((_,i)=>S.done[i]).length;
 h+=`<section class="hero" style="--c:var(--${g.c})"><div class="k">Today’s goal</div><h2>${g.n}</h2><p>${g.why}</p><button class="lk" data-a="chg">Change goal</button></section>`;
 h+=`<h3>Do these 3 things</h3>`+g.tasks.map((t,i)=>`<div class="task ${S.done[i]?"d":""}" style="--c:var(--${g.c})"><button class="tk" data-a="tick" data-i="${i}" aria-pressed="${!!S.done[i]}" aria-label="Mark done">✓</button><div><b>${t[0]}</b><div class="mu">${t[1]}</div>${t[2]?`<button class="lk" data-a="tab" data-v="sc">Open scripts</button>`:""}</div></div>`).join("");
 h+=n===3?`<div class="ok">All done for today. Well done! 🎉</div>`:`<div class="mu">${n} of 3 done</div>`;
 if(S.goal==="c"){const c=CT[T];h+=`<h3>Today’s idea: ${c.n}</h3><div class="box"><p><b>Pick one:</b></p><ul class="tips">${c.ideas.map(i=>`<li>${i}</li>`).join("")}</ul></div><h3>Caption starters (tap to copy)</h3>`+c.st.map(x=>sn("Starter",x)).join("");}
 h+=`<h3>How to do it well</h3><div class="box"><ul class="tips">${g.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
 app.innerHTML=h;
}
app.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="goal"){S.goal=b.dataset.v;save()}
 else if(a==="chg"){S.goal=null;S.done={};save()}
 else if(a==="tab")tab=b.dataset.v;
 else if(a==="tick"){S.done[b.dataset.i]=!S.done[b.dataset.i];save()}
 else if(a==="cp"){copy(COPY[b.dataset.i]);return}
 else return;
 draw();window.scrollTo(0,0);
});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
draw();
</script>
</body>
</html>
